name: Oficina
on:
  push:
    branches: [oficina]
    paths: ['office/**', '.github/workflows/office.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: New-Item -ItemType Directory -Force -Path 'D:/MIS PROYECTOS/Morphiq Oficina/temp' | Out-Null
      - run: npm ci
      - run: npm run check
